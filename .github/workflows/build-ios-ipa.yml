# Build 绿果视频 unsigned iOS IPA
#
# Standalone workflow: no secrets, no private-module checkout, no release
# gating. Builds the native Go core + Flutter app on a macOS runner and
# uploads the unsigned .ipa as an artifact.
#
# The app ships WITHOUT a bundled source module in this build (upstream CI
# bundles the private hongguo module). After installing, add sources from
# the in-app module store.

name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lvguo-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONUTF8: '1'

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decode binary assets
        # Binary assets (PNG icons, emoji, .ico) are stored as base64 text
        # (*.b64) because the push route used for this repo only accepts
        # UTF-8 files. Restore them before building.
        run: python3 scripts/decode_assets.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: Build unsigned iOS package
        # Builds the Go core into ios/DuanjuCore/DuanjuCore.xcframework,
        # then `flutter build ios --release --no-codesign` and packs the
        # unsigned .ipa into dist/ios/lvguo-<version>-ios-unsigned.ipa.
        run: python scripts/build_ios.py

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: lvguo-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
