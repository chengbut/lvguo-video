# Build 绿果视频 Android APK
#
# Standalone workflow: no secrets, no private-module checkout, no release
# gating. Builds the native Go core + Flutter app on an Ubuntu runner and
# uploads the release APKs as an artifact.
#
# IMPORTANT: the app cannot start without libduanju_core.so. The Dart code
# (lib/core_bridge.dart) loads it with DynamicLibrary.open on Android, so
# scripts/build_android.py MUST run before the Flutter build — it compiles
# the Go core for each ABI into android/app/src/main/jniLibs/<abi>/ and
# then builds split-per-ABI release APKs into dist/android/.
# A plain `flutter build apk` produces an APK with no native core that
# installs fine but crashes on launch.
#
# The app ships WITHOUT a bundled source module in this build (upstream CI
# bundles the private hongguo module). After installing, add sources from
# the in-app module store (manual install: local file or download URL).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lvguo-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decode binary assets
        # Binary assets (PNG icons, emoji, .ico) are stored as base64 text
        # (*.b64) because the push route used for this repo only accepts
        # UTF-8 files. Restore them before building.
        run: python3 scripts/decode_assets.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        # build_native.py expects NDK 28.2.13676358 under $ANDROID_HOME/ndk.
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Build Android APKs
        # Builds the Go core (.so per ABI) then split-per-ABI release APKs
        # into dist/android/lvguo-<version>-<abi>.apk.
        run: python3 scripts/build_android.py

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lvguo-android-apk
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
